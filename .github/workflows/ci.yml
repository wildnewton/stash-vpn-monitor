name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python test dependency
        run: python3 -m pip install pytest

      - name: Shell syntax check
        run: |
          bash -n vpn_monitor.sh
          bash -n install_vpn_monitor.sh
          bash -n tests/test_cli_missing_optional_args.sh
          bash -n tests/test_ci_workflow.sh
          bash -n tests/test_node_ranking_policy.sh
          bash -n tests/test_log_report.sh
          bash -n tests/test_report_module_layout.sh
          bash -n tests/test_log_report_edge_cases.sh

      - name: Python syntax check
        run: |
          python3 -m py_compile stash_switch_config.py
          python3 -m py_compile vpn_report.py

      - name: Regression tests
        run: |
          python3 -m pytest -q
          bash tests/test_cli_missing_optional_args.sh
          bash tests/test_ci_workflow.sh
          bash tests/test_node_ranking_policy.sh
          bash tests/test_log_report.sh
          bash tests/test_report_module_layout.sh
          bash tests/test_log_report_edge_cases.sh
