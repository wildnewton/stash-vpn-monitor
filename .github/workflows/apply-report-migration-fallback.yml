name: Apply report migration fallback

on:
  push:
    branches: [issue-10-log-status-report]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-10-log-status-report

      - name: Apply deterministic migration fix
        run: python3 .github/scripts/apply_report_migration_fallback.py

      - name: Commit generated fix
        run: |
          if git diff --quiet -- vpn_monitor.sh; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vpn_monitor.sh
          git commit -m "fix: support first update after report extraction"
          git push origin HEAD:issue-10-log-status-report
